[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazyportfolio"
version = "0.1.0"
description = "Hierarchical (V2) portfolio optimization engine and Tree Studio, extracted from LazyFin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LazyBridge Labs" }]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "skfolio==0.20.1",
]

[project.optional-dependencies]
# Shared market data source for MarketDataHubOptimizationBackend. Optional:
# lazyportfolio.backend imports it lazily inside load_returns(), so the
# package stays installable/testable with any OptimizationDataBackend,
# including one that doesn't touch market-data-hub at all.
datacore = ["market-data-hub @ git+https://github.com/selvaz/market-data-hub.git@f4a0a29e4d5d1e712926bb848f022f5c2756664a"]
test = ["lazyportfolio[datacore]", "pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]
dev = ["lazyportfolio[test]", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
lazyportfolio-setup = "lazyportfolio._setup:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lazyportfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_financing.py" = ["E501"]
"tests/test_scientific_study.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["lazyportfolio"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
